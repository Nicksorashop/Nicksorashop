<!-- ---- Add Offer Modal ---- -->
<div class="modal-overlay hidden" id="addModal">
  <div class="modal-box">
    <h3>Add New Offer</h3>
    <input type="text" id="offerName" placeholder="Item name (e.g. Denim Jacket)">
    <input type="text" id="offerDiscount" placeholder="Discount (e.g. 30% OFF)">
    <div class="modal-actions">
      <button id="offerCancel" type="button">Cancel</button>
      <button id="offerSave" type="button">Add</button>
    </div>
  </div>
</div>

<script>
  // Default 10 starter offers — edit these anytime in code, or use the + Add Offer button
  const defaultOffers = [
    {name:"Casual Cotton Shirt", discount:"20% OFF"},
    {name:"Slim Fit Jeans", discount:"15% OFF"},
    {name:"Denim Jacket", discount:"25% OFF"},
    {name:"Printed Kurti", discount:"10% OFF"},
    {name:"Winter Hoodie", discount:"30% OFF"},
    {name:"Formal Blazer", discount:"18% OFF"},
    {name:"Ethnic Kurta Set", discount:"22% OFF"},
    {name:"Sports T-Shirt", discount:"12% OFF"},
    {name:"Summer Dress", discount:"28% OFF"},
    {name:"Leather Belt", discount:"15% OFF"}
  ];

  function loadOffers(){
    const saved = localStorage.getItem("vyraOffers");
    return saved ? JSON.parse(saved) : defaultOffers;
  }

  function saveOffers(offers){
    localStorage.setItem("vyraOffers", JSON.stringify(offers));
  }

  function renderOffers(){
    const offers = loadOffers();
    const track = document.getElementById("marqueeTrack");
    track.innerHTML = "";

    function buildCard(offer, idx){
      const card = document.createElement("div");
      card.className = "offer-card";
      card.innerHTML = `
        <span class="badge">${offer.discount}</span>
        <div class="offer-thumb"></div>
        <h4>${offer.name}</h4>
        <button class="remove-btn" data-idx="${idx}">Remove</button>
      `;
      return card;
    }

    // Render list twice back-to-back for a seamless infinite scroll loop
    offers.forEach((o, i) => track.appendChild(buildCard(o, i)));
    offers.forEach((o, i) => track.appendChild(buildCard(o, i)));

    // Remove-button handling (only needs to work on first set; idx maps to same offer)
    track.querySelectorAll(".remove-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const offers = loadOffers();
        offers.splice(parseInt(btn.dataset.idx), 1);
        saveOffers(offers);
        renderOffers();
      });
    });
  }

  function openModal(){
    document.getElementById("addModal").classList.remove("hidden");
  }
  function closeModal(){
    document.getElementById("addModal").classList.add("hidden");
    document.getElementById("offerName").value = "";
    document.getElementById("offerDiscount").value = "";
  }

  document.getElementById("addOfferTop").addEventListener("click", openModal);
  document.getElementById("addOfferBottom").addEventListener("click", openModal);
  document.getElementById("offerCancel").addEventListener("click", closeModal);

  document.getElementById("offerSave").addEventListener("click", () => {
    const name = document.getElementById("offerName").value.trim();
    const discount = document.getElementById("offerDiscount").value.trim();
    if(!name){ alert("Item ka naam daalein"); return; }
    const offers = loadOffers();
    offers.push({name: name, discount: discount || "OFFER"});
    saveOffers(offers);
    renderOffers();
    closeModal();
  });

  renderOffers();
</script>

<!-- ---- Add Resell Product Modal ---- -->
<div class="modal-overlay hidden" id="resellModal">
  <div class="modal-box">
    <h3>Add Product to Resell</h3>
    <input type="text" id="resellName" placeholder="Product name">
    <input type="url" id="resellLink" placeholder="Product link (https://...)">
    <input type="number" id="resellOriginal" placeholder="Original price (e.g. 300)">
    <input type="number" id="resellSelling" placeholder="Your selling price (e.g. 500)">
    <div class="modal-actions">
      <button id="resellCancel" type="button">Cancel</button>
      <button id="resellSave" type="button">Add</button>
    </div>
  </div>
</div>

<script>
  // ---- Resell / Affiliate balance system ----
  function loadResell(){
    const saved = localStorage.getItem("vyraResellProducts");
    return saved ? JSON.parse(saved) : [];
  }
  function saveResell(items){
    localStorage.setItem("vyraResellProducts", JSON.stringify(items));
  }
  function loadBalance(){
    return parseFloat(localStorage.getItem("vyraBalance") || "0");
  }
  function saveBalance(val){
    localStorage.setItem("vyraBalance", val);
    document.getElementById("balanceDisplay").textContent = "₹" + val.toLocaleString("en-IN");
  }

  function renderResell(){
    const items = loadResell();
    const grid = document.getElementById("resellGrid");
    grid.innerHTML = "";

    if(items.length === 0){
      grid.innerHTML = '<div class="empty-note">Koi product add nahi hua abhi tak. "+ Add Product to Resell" dabakar shuru karein.</div>';
      return;
    }

    items.forEach((item, idx) => {
      const profit = item.selling - item.original;
      const card = document.createElement("div");
      card.className = "resell-card";
      card.innerHTML = `
        <h3>${item.name}</h3>
        <a class="src-link" href="${item.link}" target="_blank" rel="noopener">${item.link}</a>
        <div class="resell-row"><span>Original Price</span><b>₹${item.original}</b></div>
        <div class="resell-row"><span>Your Selling Price</span><b>₹${item.selling}</b></div>
        <div class="resell-row profit"><span>Profit per Sale</span><b>₹${profit}</b></div>
        <div class="resell-actions">
          <button class="sell-btn" data-idx="${idx}">Mark as Sold</button>
          <button class="del-btn" data-idx="${idx}">Remove</button>
        </div>
      `;
      grid.appendChild(card);
    });

    grid.querySelectorAll(".sell-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const items = loadResell();
        const item = items[parseInt(btn.dataset.idx)];
        const profit = item.selling - item.original;
        saveBalance(loadBalance() + profit);
        alert(`Sold! ₹${profit} profit aapke balance mein add ho gaya.`);
      });
    });
    grid.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const items = loadResell();
        items.splice(parseInt(btn.dataset.idx), 1);
        saveResell(items);
        renderResell();
      });
    });
  }

  function openResellModal(){
    document.getElementById("resellModal").classList.remove("hidden");
  }
  function closeResellModal(){
    document.getElementById("resellModal").classList.add("hidden");
    ["resellName","resellLink","resellOriginal","resellSelling"].forEach(id => document.getElementById(id).value = "");
  }

  document.getElementById("addResellBtn").addEventListener("click", openResellModal);
  document.getElementById("resellCancel").addEventListener("click", closeResellModal);

  document.getElementById("resellSave").addEventListener("click", () => {
    const name = document.getElementById("resellName").value.trim();
    const link = document.getElementById("resellLink").value.trim();
    const original = parseFloat(document.getElementById("resellOriginal").value);
    const selling = parseFloat(document.getElementById("resellSelling").value);

    if(!name || !link || isNaN(original) || isNaN(selling)){
      alert("Sabhi fields sahi se bharein — naam, link, original price, selling price.");
      return;
    }
    if(selling <= original){
      alert("Selling price original price se zyada honi chahiye taaki profit ho.");
      return;
    }

    const items = loadResell();
    items.push({name, link, original, selling});
    saveResell(items);
    renderResell();
    closeResellModal();
  });

  saveBalance(loadBalance());
  renderResell();
</script>

<!-- ---- Cart Modal ---- -->
<div class="modal-overlay hidden" id="cartModal">
  <div class="modal-box" style="width:340px;">
    <h3>Your Cart</h3>
    <div id="cartItemsList"></div>
    <div class="cart-total" id="cartTotalRow" style="display:none;">
      <span>Total</span>
      <span id="cartTotalAmount">₹0</span>
    </div>
    <div class="modal-actions" style="margin-top:14px;">
      <button id="cartClose" type="button">Close</button>
      <button id="cartCheckout" type="button">Checkout</button>
    </div>
  </div>
</div>

<script>
  // ---- Cart system ----
  function loadCart(){
    const saved = localStorage.getItem("vyraCart");
    return saved ? JSON.parse(saved) : [];
  }
  function saveCart(cart){
    localStorage.setItem("vyraCart", JSON.stringify(cart));
    updateCartCount();
  }
  function updateCartCount(){
    const cart = loadCart();
    const count = cart.reduce((sum, i) => sum + i.qty, 0);
    document.getElementById("cartCount").textContent = count;
  }

  function addToCart(name, price){
    const cart = loadCart();
    const existing = cart.find(i => i.name === name);
    if(existing){ existing.qty += 1; }
    else{ cart.push({name, price, qty:1}); }
    saveCart(cart);
    alert(name + " cart mein add ho gaya.");
  }

  document.querySelectorAll(".add-cart-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      addToCart(btn.dataset.name, parseFloat(btn.dataset.price));
    });
  });

  function renderCart(){
    const cart = loadCart();
    const list = document.getElementById("cartItemsList");
    list.innerHTML = "";

    if(cart.length === 0){
      list.innerHTML = '<div class="empty-note">Cart abhi khali hai.</div>';
      document.getElementById("cartTotalRow").style.display = "none";
      return;
    }

    let total = 0;
    cart.forEach((item, idx) => {
      total += item.price * item.qty;
      const row = document.createElement("div");
      row.className = "cart-item";
      row.innerHTML = `
        <span class="name">${item.name} × ${item.qty}</span>
        <span class="price">₹${item.price * item.qty}</span>
        <button data-idx="${idx}">✕</button>
      `;
      list.appendChild(row);
    });

    document.getElementById("cartTotalRow").style.display = "flex";
    document.getElementById("cartTotalAmount").textContent = "₹" + total;

    list.querySelectorAll("button[data-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cart = loadCart();
        cart.splice(parseInt(btn.dataset.idx), 1);
        saveCart(cart);
        renderCart();
      });
    });
  }

  document.getElementById("cartBtn").addEventListener("click", () => {
    renderCart();
    document.getElementById("cartModal").classList.remove("hidden");
  });
  document.getElementById("cartClose").addEventListener("click", () => {
    document.getElementById("cartModal").classList.add("hidden");
  });
  document.getElementById("cartCheckout").addEventListener("click", () => {
    const cart = loadCart();
    if(cart.length === 0){ alert("Cart khali hai."); return; }
    alert("Order placed! (Ye ek demo checkout hai — real payment ke liye payment gateway integrate karna hoga.)");
    saveCart([]);
    renderCart();
    document.getElementById("cartModal").classList.add("hidden");
  });

  updateCartCount();
</script>

