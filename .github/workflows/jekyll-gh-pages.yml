<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicksorashop — Clothing Store</title>
<style>
  :root{
    --bg:#1c1e22;
    --panel:#24262b;
    --panel-border:#2f3238;
    --header-a:#23262b;
    --header-b:#1a3b5c;
    --blue:#1a5fb4;
    --blue-hover:#2b7ae0;
    --link:#4aa8ff;
    --link-hover:#7cc4ff;
    --text:#e0e0e0;
    --text-dim:#999999;
    --white:#ffffff;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Arial, sans-serif;
    line-height:1.6;
  }

  a{color:var(--link); text-decoration:none;}
  a:hover{color:var(--link-hover);}

  /* ---- Header ---- */
  header{
    background:linear-gradient(90deg, var(--header-a), var(--header-b));
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
  }

  .brand{
    font-size:22px;
    font-weight:600;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:0;
    letter-spacing:0.5px;
    position:relative;
  }
  .brand .brand-name{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .brand .first-letter{
    font-size:28px;
    font-weight:700;
    color:var(--link);
    font-family:Georgia, 'Times New Roman', serif;
    line-height:1;
  }
  .brand .rest{
    text-transform:lowercase;
  }
  .brand .india-tag{
    font-size:10px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:3px;
    letter-spacing:0.3px;
    margin-top:-2px;
  }
  .brand .india-tag .globe{
    font-size:13px;
  }

  nav{display:flex; gap:18px; flex-wrap:wrap;}
  nav a{color:var(--text); font-size:14px;}
  nav a:hover{color:var(--white);}

  .search-box{
    display:flex;
    align-items:center;
  }
  .search-box input{
    width:220px;
    max-width:60vw;
    padding:8px 12px;
    font-size:14px;
    border-radius:6px 0 0 6px;
    border:1px solid #3a3d42;
    background:#2a2d33;
    color:var(--text);
    outline:none;
  }
  .search-box button{
    padding:8px 12px;
    border:none;
    border-radius:0 6px 6px 0;
    background:var(--blue);
    color:var(--white);
    cursor:pointer;
  }
  .search-box button:hover{background:var(--blue-hover);}

  .cart-btn{
    position:relative;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    padding:8px 12px;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
  }
  .cart-btn:hover{background:#2a2d33;}
  .cart-count{
    position:absolute;
    top:-6px; right:-6px;
    background:var(--rust, #c0392b);
    color:#fff;
    font-size:10px;
    min-width:16px;
    height:16px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3px;
  }

  /* ---- Cart Modal ---- */
  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--panel-border);
    font-size:13px;
  }
  .cart-item span.name{color:var(--text); flex:1;}
  .cart-item span.price{color:var(--link); font-weight:600;}
  .cart-item button{
    background:none; border:none; color:var(--text-dim);
    cursor:pointer; font-size:16px; line-height:1;
  }
  .cart-item button:hover{color:#e06c5c;}
  .cart-total{
    display:flex;
    justify-content:space-between;
    padding:14px 0 6px;
    font-size:15px;
    color:var(--white);
    font-weight:600;
  }
  .add-cart-btn{
    width:100%;
    background:#33363c;
    color:var(--text);
    border:none;
    border-radius:6px;
    padding:8px 0;
    margin-top:8px;
    cursor:pointer;
    font-size:13px;
  }
  .add-cart-btn:hover{background:#3a3d42;}

  /* ---- About Section ---- */
  .about-section{
    max-width:1100px;
    margin:0 auto;
    padding:10px 24px 40px;
  }
  .about-section h2{
    color:var(--white);
    font-size:20px;
    font-weight:600;
    margin-bottom:14px;
  }
  .about-section .about-box{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:22px;
  }
  .about-section p{
    color:var(--text-dim);
    font-size:14px;
    line-height:1.8;
    margin-bottom:12px;
  }
  .about-section p:last-child{margin-bottom:0;}
  .about-section strong{color:var(--text);}

  /* ---- Contact Section ---- */
  .contact-section{
    max-width:1100px;
    margin:0 auto;
    padding:10px 24px 40px;
  }
  .contact-section h2{
    color:var(--white);
    font-size:20px;
    font-weight:600;
    margin-bottom:14px;
  }
  .contact-box{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:22px;
    display:flex;
    gap:24px;
    flex-wrap:wrap;
  }
  .contact-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    color:var(--text);
  }
  .contact-item .ic{font-size:18px;}
  .contact-item a{color:var(--link);}

  .footer-links{
    display:flex;
    gap:16px;
    justify-content:center;
    margin-bottom:8px;
    font-size:13px;
  }
  .footer-links a{color:var(--text-dim);}
  .footer-links a:hover{color:var(--link);}

  .footer-badges{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .footer-badge{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:20px;
    padding:4px 10px;
  }
  .footer-badge .ic{font-size:12px;}

  /* ---- Hero ---- */
  .hero{
    max-width:1100px;
    margin:40px auto;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
    flex-wrap:wrap;
  }
  .hero-text h1{
    font-size:32px;
    color:var(--white);
    font-weight:600;
    max-width:480px;
  }
  .hero-text p{
    margin-top:12px;
    color:var(--text-dim);
    max-width:420px;
  }
  .hero-text .cta{
    display:inline-block;
    margin-top:20px;
    background:var(--blue);
    color:var(--white);
    padding:10px 20px;
    border-radius:6px;
  }
  .hero-text .cta:hover{background:var(--blue-hover); color:var(--white);}

  .new-arrivals-grid{
    display:flex;
    flex-wrap:nowrap;
    gap:10px;
    width:100%;
    max-width:520px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .new-arrivals-grid .hero-card{
    flex:0 0 auto;
    width:110px;
  }
  .hero-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:10px;
    text-align:center;
  }
  .hero-card .thumb{
    width:100%; height:70px;
    margin-bottom:8px;
    background:linear-gradient(145deg, #2a2d33, #1a3b5c);
    border-radius:10px;
    border:1px solid #3a3d42;
  }
  .hero-card h3{color:var(--white); font-size:12px; margin-bottom:4px; font-weight:500;}
  .hero-card p{color:var(--link); font-weight:600; font-size:12px;}

  @media(max-width:640px){
    .new-arrivals-grid{max-width:100%;}
    .hero-card{padding:6px;}
    .hero-card .thumb{height:50px;}
  }

  /* ---- Section title ---- */
  .section{
    max-width:1100px;
    margin:0 auto;
    padding:20px 24px 40px;
  }
  .section h2{
    color:var(--white);
    font-size:20px;
    font-weight:600;
    margin-bottom:16px;
  }

  /* ---- Product / Shop Grid ---- */
  .shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:16px;
  }
  .product-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:14px;
    text-align:center;
  }
  .product-card .thumb{
    width:100%;
    height:150px;
    border-radius:8px;
    margin-bottom:10px;
    background:linear-gradient(135deg,#2a2d33,#1a3b5c);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--link);
    font-size:13px;
  }
  .product-card h3{
    font-size:15px;
    color:var(--white);
    margin-bottom:6px;
  }
  .product-card .price{
    color:var(--link);
    font-weight:600;
    margin-bottom:10px;
  }
  .product-card button{
    width:100%;
    background:var(--blue);
    color:var(--white);
    border:none;
    border-radius:6px;
    padding:8px 0;
    cursor:pointer;
    font-size:13px;
  }
  .product-card button:hover{background:var(--blue-hover);}
  .product-card .btn-row{
    display:flex;
    gap:8px;
  }
  .product-card .btn-row button{
    flex:1;
    width:auto;
  }
  .product-card .btn-row .add-cart-btn{
    background:#33363c;
    color:var(--text);
  }
  .product-card .btn-row .add-cart-btn:hover{background:#3a3d42;}

  /* ---- Post / Blog style block ---- */
  .post{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .post h3{color:var(--white); margin-bottom:6px;}
  .post p{color:#d0d0d0; font-size:14px;}

  /* ---- Footer ---- */
  footer{
    background:#17181b;
    color:var(--text-dim);
    text-align:center;
    padding:24px;
    margin-top:30px;
    font-size:13px;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--blue); border-radius:10px;}

  @media(max-width:640px){
    .hero{flex-direction:column;}
  }

  /* ---- Offers Scroller (below header) ---- */
  .promo-wrap{
    background:var(--panel);
    border-bottom:1px solid var(--panel-border);
    padding:14px 0;
  }
  .promo-head{
    max-width:1100px;
    margin:0 auto 10px;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .promo-head h2{
    font-size:15px;
    color:var(--white);
    font-weight:600;
  }
  .add-offer-btn{
    background:var(--blue);
    color:var(--white);
    border:none;
    border-radius:6px;
    padding:7px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .add-offer-btn:hover{background:var(--blue-hover);}

  .marquee{
    overflow:hidden;
    width:100%;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
  }
  .marquee-track{
    display:flex;
    gap:14px;
    width:max-content;
    padding:0 24px;
    animation:scrollLeft 32s linear infinite;
  }
  .marquee:hover .marquee-track{
    animation-play-state:paused;
  }
  @keyframes scrollLeft{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }
  .offer-card{
    flex:0 0 auto;
    width:170px;
    background:var(--bg);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:12px;
    text-align:center;
    position:relative;
  }
  .offer-card .badge{
    position:absolute;
    top:8px; right:8px;
    background:var(--rust, #a8563e);
    background:#c0392b;
    color:#fff;
    font-size:11px;
    padding:2px 7px;
    border-radius:20px;
    font-weight:600;
  }
  .offer-card .offer-thumb{
    width:100%;
    height:70px;
    border-radius:8px;
    margin-bottom:8px;
    background:linear-gradient(135deg,#2a2d33,#1a3b5c);
  }
  .offer-card h4{
    font-size:13px;
    color:var(--white);
    font-weight:500;
  }
  .offer-card .remove-btn{
    margin-top:6px;
    font-size:11px;
    color:var(--text-dim);
    background:none;
    border:none;
    cursor:pointer;
  }
  .offer-card .remove-btn:hover{color:#e06c5c;}

  .bottom-add-wrap{
    max-width:1100px;
    margin:0 auto;
    padding:0 24px 30px;
    text-align:center;
  }

  /* ---- Trust / About Section ---- */
  .trust-section{
    max-width:1100px;
    margin:0 auto;
    padding:10px 24px 40px;
  }
  .trust-section h2{
    color:var(--white);
    font-size:20px;
    font-weight:600;
    margin-bottom:10px;
  }
  .trust-section .trust-desc{
    color:var(--text-dim);
    font-size:14px;
    max-width:640px;
    margin-bottom:20px;
    line-height:1.7;
  }
  .trust-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:14px;
  }
  .trust-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:18px 14px;
    text-align:center;
  }
  .trust-card .icon{
    font-size:26px;
    margin-bottom:8px;
  }
  .trust-card h4{
    color:var(--white);
    font-size:14px;
    margin-bottom:4px;
  }
  .trust-card p{
    color:var(--text-dim);
    font-size:12px;
    line-height:1.5;
  }
  .resell-section{
    max-width:1100px;
    margin:0 auto;
    padding:20px 24px 40px;
  }
  .resell-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .resell-head h2{
    color:var(--white);
    font-size:20px;
    font-weight:600;
  }
  .balance-pill{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:10px 18px;
    text-align:right;
  }
  .balance-pill span{display:block; font-size:11px; color:var(--text-dim);}
  .balance-pill strong{font-size:20px; color:#4ade80;}

  .resell-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:16px;
  }
  .resell-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:14px;
  }
  .resell-card h3{
    font-size:15px;
    color:var(--white);
    margin-bottom:6px;
  }
  .resell-card a.src-link{
    font-size:12px;
    color:var(--link);
    word-break:break-all;
    display:block;
    margin-bottom:8px;
  }
  .resell-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .resell-row b{color:var(--text);}
  .resell-row.profit b{color:#4ade80;}
  .resell-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .resell-actions button{
    flex:1;
    padding:8px 0;
    border:none;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  .sell-btn{background:var(--blue); color:var(--white);}
  .sell-btn:hover{background:var(--blue-hover);}
  .del-btn{background:#33363c; color:var(--text-dim);}
  .del-btn:hover{background:#3a3d42; color:#e06c5c;}

  .empty-note{
    color:var(--text-dim);
    font-size:13px;
    padding:20px;
    text-align:center;
    border:1px dashed var(--panel-border);
    border-radius:10px;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .modal-overlay.hidden{display:none;}
  .modal-box{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:22px;
    width:300px;
    max-width:90vw;
  }
  .modal-box h3{
    color:var(--white);
    font-size:16px;
    margin-bottom:14px;
  }
  .modal-box input{
    width:100%;
    padding:9px 10px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #3a3d42;
    background:#2a2d33;
    color:var(--text);
    font-size:14px;
    outline:none;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .modal-actions button{
    flex:1;
    padding:9px 0;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
  }
  #offerCancel{background:#33363c; color:var(--text);}
  #offerCancel:hover{background:#3a3d42;}
  #offerSave{background:var(--blue); color:var(--white);}
  #offerSave:hover{background:var(--blue-hover);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name"><span class="first-letter">N</span><span class="rest">icksorashop</span></div>
    <div class="india-tag"><span class="globe">🌍</span>India</div>
  </div>
  <nav>
    <a href="#shop">Shop</a>
    <a href="#collection">Collection</a>
    <a href="#blog">Blog</a>
    <a href="#contact">Contact</a>
  </nav>
  <div class="search-box">
    <input type="text" placeholder="Search products...">
    <button type="button">Search</button>
  </div>
  <button class="cart-btn" id="profileBtn">👤 Profile</button>
  <button class="cart-btn" id="cartBtn">🛒 Cart<span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="promo-wrap">
  <div class="promo-head">
    <h2>Offers &amp; Deals</h2>
    <button class="add-offer-btn" id="addOfferTop">+ Add Offer</button>
  </div>
  <div class="marquee">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>
</div>

<section class="hero">
  <div class="hero-text">
    <h1>Nicksorashop — clothing that fits your everyday</h1>
    <p>Latest fashion collection, comfortable fabrics aur trendy designs — sab kuch ek hi jagah, seedha aapke ghar tak.</p>
    <a href="#shop" class="cta">Shop Now</a>
  </div>
  <div class="new-arrivals-grid">
    <div class="hero-card">
      <div class="thumb"></div>
      <h3>New Arrival</h3>
      <p>₹1,499</p>
    </div>
    <div class="hero-card">
      <div class="thumb"></div>
      <h3>New Arrival</h3>
      <p>₹1,799</p>
    </div>
    <div class="hero-card">
      <div class="thumb"></div>
      <h3>New Arrival</h3>
      <p>₹1,299</p>
    </div>
    <div class="hero-card">
      <div class="thumb"></div>
      <h3>New Arrival</h3>
      <p>₹1,999</p>
    </div>
  </div>
</section>

<section id="shop" class="section">
  <h2>Featured Products</h2>
  <div class="shop-grid">
    <div class="product-card">
      <div class="thumb">Shirt</div>
      <h3>Casual Cotton Shirt</h3>
      <div class="price">₹899</div>
      <div class="btn-row">
        <button type="button" class="add-cart-btn" data-name="Casual Cotton Shirt" data-price="899">Add to Cart</button>
        <button type="button">Buy Now</button>
      </div>
    </div>
    <div class="product-card">
      <div class="thumb">Jeans</div>
      <h3>Slim Fit Jeans</h3>
      <div class="price">₹1,299</div>
      <div class="btn-row">
        <button type="button" class="add-cart-btn" data-name="Slim Fit Jeans" data-price="1299">Add to Cart</button>
        <button type="button">Buy Now</button>
      </div>
    </div>
    <div class="product-card">
      <div class="thumb">Jacket</div>
      <h3>Denim Jacket</h3>
      <div class="price">₹1,999</div>
      <div class="btn-row">
        <button type="button" class="add-cart-btn" data-name="Denim Jacket" data-price="1999">Add to Cart</button>
        <button type="button">Buy Now</button>
      </div>
    </div>
    <div class="product-card">
      <div class="thumb">Kurti</div>
      <h3>Printed Kurti</h3>
      <div class="price">₹749</div>
      <div class="btn-row">
        <button type="button" class="add-cart-btn" data-name="Printed Kurti" data-price="749">Add to Cart</button>
